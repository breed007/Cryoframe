# Builds CryoframeKit and runs its test suite on macOS. Cloud agent sessions run
# on Linux and can't build this app, so this is the only place their pull
# requests get compiled and tested before a merge.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # macos-15 is the oldest release Cryoframe supports, and its Xcode 16 compiler
    # is stricter in places than the one releases are built with; macos-26 is
    # closer to the release toolchain. A change has to build and pass on both.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Keep XProtect off the disk images
        # A known hazard on GitHub's macOS runners: XProtect scans each new disk
        # image, and hdiutil create/attach can hang behind it for good. The first
        # runs here stalled on exactly that (a `hdiutil create -srcfolder` twelve
        # minutes old). The release Mac is not affected.
        run: |
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          for _ in $(seq 1 10); do pgrep XProtect >/dev/null || break; sleep 3; done

      - name: Run the test suite
        # unsigned: the Developer ID certificate lives on the release Mac, and the
        # Kit tests are fake-backed, so they need neither signing nor root
        run: |
          set +e                  # collect the log and the verdict ourselves
          xcodebuild -version
          xcodebuild test -scheme Cryoframe-Core -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" > test.log 2>&1 &
          pid=$!
          # The suite takes about three minutes on a Mac. If it is still going after
          # fifteen, something is wedged: record what every process under the test
          # runner is doing before giving up, so the log says why.
          for _ in $(seq 1 180); do kill -0 $pid 2>/dev/null || break; sleep 5; done
          if kill -0 $pid 2>/dev/null; then
            echo "::error::the test suite stalled; process state follows"
            ps -axo pid,ppid,etime,stat,command | grep -Ei 'xctest|CryoframeKitTests|hdiutil|diskimages|ditto|rsync|tmutil|sqlite3|split' | grep -v grep
            for p in $(pgrep -f 'CryoframeKitTests|xctest'); do sample "$p" 3 -mayDie 2>/dev/null | head -400; done
            kill $pid; sleep 5
          fi
          wait $pid; status=$?
          grep -vE '^(CompileSwift|SwiftCompile|SwiftDriver|Ld|CodeSign|ProcessInfoPlistFile|WriteAuxiliaryFile|CreateBuildDirectory|MkDir|Copy|Touch|RegisterExecutionPolicyException|GenerateAssetSymbols|note:|    cd |    export |    /Applications/Xcode)' test.log
          exit $status
