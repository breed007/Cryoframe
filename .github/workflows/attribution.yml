# Every commit in this repo is authored by its owner. This check fails a push or
# pull request whose commits carry another author, or whose messages or PR text
# carry agent attribution (Co-Authored-By trailers, session links, "Generated
# with" lines). See CLAUDE.md.
name: Attribution

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit authors and messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          allowed_authors='^(breed007@gmail\.com|41339110\+breed007@users\.noreply\.github\.com)$'
          # GitHub itself commits web edits and merge-button merges
          allowed_committers='^(breed007@gmail\.com|41339110\+breed007@users\.noreply\.github\.com|noreply@github\.com)$'
          banned='co-authored-by:|claude-session:|noreply@anthropic\.com|generated with \[?claude|claude\.ai/code'

          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_AFTER --not --remotes=origin/main"   # new branch: its own commits only
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi

          fail=0
          for c in $(git rev-list $range); do
            ae=$(git log -1 --format=%ae "$c"); ce=$(git log -1 --format=%ce "$c")
            subj=$(git log -1 --format='%h %s' "$c")
            if ! echo "$ae" | grep -Eq "$allowed_authors"; then
              echo "::error::$subj — author is $(git log -1 --format='%an <%ae>' "$c")"; fail=1
            fi
            if ! echo "$ce" | grep -Eq "$allowed_committers"; then
              echo "::error::$subj — committer is $(git log -1 --format='%cn <%ce>' "$c")"; fail=1
            fi
            if git log -1 --format=%B "$c" | grep -Eiq "$banned"; then
              echo "::error::$subj — message carries attribution:"
              git log -1 --format=%B "$c" | grep -Ei "$banned" | sed 's/^/    /'
              fail=1
            fi
          done
          exit $fail

      - name: Check pull request text
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          banned='co-authored-by:|claude-session:|noreply@anthropic\.com|generated with \[?claude|claude\.ai/code'
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$banned"; then
            echo "::error::pull request title or body carries attribution:"
            printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Ei "$banned" | sed 's/^/    /'
            exit 1
          fi
